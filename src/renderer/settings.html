<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <title>Settings</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <span class="mark"></span>
        <span>Settings</span>
      </div>
      <nav id="nav"></nav>
      <div class="about">
        <div class="name">IE2</div>
        <div class="version" id="version"></div>
      </div>
    </aside>

    <main>
      <div class="searchwrap">
        <input id="filter" type="search" placeholder="Search settings" autocomplete="off" />
      </div>
      <div id="panels"></div>
    </main>

    <div id="modal" hidden>
      <div class="sheet">
        <h3 id="modal-title"></h3>
        <p id="modal-body"></p>
        <label id="modal-extra" hidden>
          <input type="checkbox" id="modal-check" />
          <span id="modal-check-label"></span>
        </label>
        <div class="actions">
          <button id="modal-cancel">Cancel</button>
          <button id="modal-ok" class="danger">Confirm</button>
        </div>
      </div>
    </div>

    <script type="module" src="./settings.ts"></script>
  </body>
</html>
